name: engine

on:
  push:
    paths: ["engine/**", "tools/**", "app/lib/**", "app/test/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", "tools/**", "app/lib/**", "app/test/**", ".github/workflows/engine.yml"]

jobs:
  build-test-eval:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # A slow package mirror has hung this step for 20+ minutes: give up after
      # 8 minutes per attempt and try again (three attempts).
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 480 bash -c 'sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
                sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
                  cmake ninja-build g++ libopencv-dev libeigen3-dev libgtest-dev \
                  nlohmann-json3-dev ffmpeg python3-numpy python3-opencv'; then
              exit 0
            fi
            echo "attempt $attempt failed or timed out"
          done
          exit 1

      - name: Build
        run: |
          cmake -S engine -B engine/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build

      - name: Get the AI model and a test picture
        run: |
          mkdir -p out/ai
          curl -sSL -o out/ai/yolox_nano.onnx https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_nano.onnx
          echo "c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d  out/ai/yolox_nano.onnx" | sha256sum -c
          curl -sSL -o out/ai/messi5.jpg https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/messi5.jpg

      - name: Unit tests (engine math, AI assist)
        env:
          PE_AI_MODEL: ${{ github.workspace }}/out/ai/yolox_nano.onnx
          PE_AI_IMAGE: ${{ github.workspace }}/out/ai/messi5.jpg
        run: ./engine/build/pocketeye-tests

      - name: Synthetic accuracy gate (random deliveries, 720p30)
        run: |
          python3 tools/eval/run_eval.py --generate 24 --seed 101 --work out/eval_random \
            --report out/eval_random.md --gate

      - name: "Synthetic accuracy gate (old-phone JPEG stream to the laptop, same scenes)"
        run: |
          python3 tools/eval/run_eval.py --work out/eval_random --jpeg-quality 70 \
            --report out/eval_jpeg.md --gate

      - name: Automatic stump calibration gate (same scenes)
        run: python3 tools/eval/eval_autocal.py --scenes out/eval_random --gate

      - name: Synthetic accuracy gate (plumb LBWs must be OUT)
        run: |
          python3 tools/eval/run_eval.py --generate 12 --seed 202 --scenario plumb \
            --work out/eval_plumb --report out/eval_plumb.md --gate

      - name: "Synthetic accuracy gate (practice, no batter)"
        run: |
          python3 tools/eval/run_eval.py --generate 12 --seed 303 --scenario practice \
            --work out/eval_practice --report out/eval_practice.md --gate

      - name: "Synthetic accuracy gate (balls hitting empty stumps: BOWLED, never missing)"
        run: |
          python3 tools/eval/run_eval.py --generate 16 --seed 404 --scenario bowled \
            --work out/eval_bowled --report out/eval_bowled.md --gate

      # The app's screens and workers against the engine just built (the
      # calibration screen, live mode, the worker isolates).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: App tests with the engine
        working-directory: app
        env:
          POCKETEYE_LIB: ${{ github.workspace }}/engine/build/libpocketeye_c.so
          POCKETEYE_SCENE: ${{ github.workspace }}/out/eval_random/scene_0000
          POCKETEYE_AI_MODEL: ${{ github.workspace }}/out/ai/yolox_nano.onnx
        run: |
          flutter pub get
          flutter test

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-reports
          path: out/*.md
