name: apps

# Builds the downloadable apps:
#   PocketEye-windows       Windows laptop app (zip with PocketEye.exe) + command-line tool
#   PocketEye-android       Phone app (phone-only mode), Android 7+, one APK per CPU type
#   PocketEyeCamera-android Camera app for old phones (Android 5+), streams to the laptop
on:
  push:
    paths: ["app/**", "engine/**", "camera_lite/**", ".github/workflows/apps.yml"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.7"
  OPENCV_VERSION: "4.10.0"
  # YOLO assist model (YOLOX-Nano, COCO, Apache-2.0), 3.6 MB.
  AI_MODEL_URL: "https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_nano.onnx"
  AI_MODEL_SHA256: "c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get OpenCV for Windows
        shell: pwsh
        run: |
          curl.exe -sSL -o opencv.exe "https://github.com/opencv/opencv/releases/download/$env:OPENCV_VERSION/opencv-$env:OPENCV_VERSION-windows.exe"
          7z x opencv.exe -oC:\ -y | Out-Null
          Get-ChildItem C:\opencv\build\x64\vc16\bin

      - name: Build engine (DLL + command-line tool)
        run: |
          cmake -S engine -B engine/build-win -A x64 -DOpenCV_DIR=C:/opencv/build/x64/vc16/lib -DPE_BUILD_TESTS=OFF
          cmake --build engine/build-win --config Release --parallel

      - name: Collect native libraries
        shell: pwsh
        run: |
          $ver = $env:OPENCV_VERSION -replace '\.', ''
          New-Item -ItemType Directory -Force native, cli | Out-Null
          $runtime = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") | ForEach-Object { "C:\Windows\System32\$_" }
          $ocv = @("C:\opencv\build\x64\vc16\bin\opencv_world$ver.dll", "C:\opencv\build\x64\vc16\bin\opencv_videoio_ffmpeg${ver}_64.dll")
          Copy-Item -Path (@("engine/build-win/Release/pocketeye_c.dll") + $ocv + $runtime) -Destination native/
          Copy-Item -Path (@("engine/build-win/Release/pocketeye-cli.exe") + $ocv + $runtime) -Destination cli/
          Get-ChildItem native, cli

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Windows app
        working-directory: app
        env:
          POCKETEYE_NATIVE_DIR: ${{ github.workspace }}\native
        run: flutter build windows --release

      - name: Get the AI model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          curl.exe -sSL -o models/yolox_nano.onnx $env:AI_MODEL_URL
          $h = (Get-FileHash models/yolox_nano.onnx -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:AI_MODEL_SHA256) { throw "AI model checksum mismatch: $h" }
          # Apache-2.0: the licence goes with the model.
          curl.exe -sSL -o models/YOLOX-LICENSE.txt https://raw.githubusercontent.com/Megvii-BaseDetection/YOLOX/main/LICENSE

      - name: Package
        shell: pwsh
        run: |
          $rel = "app/build/windows/x64/runner/Release"
          Rename-Item "$rel/pocketeye.exe" "PocketEye.exe"
          Copy-Item -Recurse models "$rel/models"
          Copy-Item -Recurse models cli/models
          Get-ChildItem $rel
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$rel/*" -DestinationPath dist/PocketEye-windows.zip
          Compress-Archive -Path cli/* -DestinationPath dist/pocketeye-cli-windows.zip

      - name: Smoke test (engine loads, benchmark runs)
        shell: pwsh
        run: |
          ./cli/pocketeye-cli.exe version
          ./cli/pocketeye-cli.exe benchmark --frames 60
          # The AI model runs (this machine has no GPU: the CPU is used instead).
          curl.exe -sSL -o messi5.jpg https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/messi5.jpg
          ./cli/pocketeye-cli.exe ai-test --model cli/models/yolox_nano.onnx --image messi5.jpg --device dgpu
          if ($LASTEXITCODE -ne 0) { throw "AI model did not load" }

      - uses: actions/upload-artifact@v4
        with:
          name: PocketEye-windows
          path: dist/*.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Get OpenCV Android SDK
        run: |
          curl -sSL -o ocv.zip "https://github.com/opencv/opencv/releases/download/${OPENCV_VERSION}/opencv-${OPENCV_VERSION}-android-sdk.zip"
          mkdir -p third_party && unzip -q ocv.zip -d third_party
          ls third_party/OpenCV-android-sdk/sdk/native

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build phone app (phone-only mode)
        working-directory: app
        env:
          OPENCV_ANDROID_SDK: ${{ github.workspace }}/third_party/OpenCV-android-sdk
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Build camera app for old phones
        working-directory: camera_lite
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/PocketEye-arm64.apk
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/PocketEye-arm32.apk
          cp camera_lite/app/build/outputs/apk/release/app-release.apk dist/PocketEyeCamera.apk
          ls -la dist

      - name: Check the engine is inside the APKs with all its libraries
        run: |
          system="libc.so libm.so libdl.so liblog.so libandroid.so libz.so libjnigraphics.so libmediandk.so libcamera2ndk.so libGLESv2.so libEGL.so"
          for apk in dist/PocketEye-arm64.apk dist/PocketEye-arm32.apk; do
            d=$(mktemp -d); unzip -q "$apk" 'lib/*' -d "$d"
            abi=$(ls "$d/lib"); echo "$apk ($abi):"; ls -la "$d/lib/$abi"
            so="$d/lib/$abi/libpocketeye_c.so"
            test -f "$so" || { echo "libpocketeye_c.so missing"; exit 1; }
            for need in $(readelf -d "$so" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p'); do
              case " $system " in *" $need "*) continue;; esac
              test -f "$d/lib/$abi/$need" || { echo "$need needed but not in the APK"; exit 1; }
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: PocketEye-android
          path: dist/*.apk

  # Direct download links (easier on a phone than the zipped artifacts). Every
  # successful build is a new release marked "latest", so these links always
  # give the newest files (nothing is deleted or re-tagged):
  #   https://github.com/<owner>/<repo>/releases/latest/download/PocketEye-arm64.apk
  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish a release for this build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          gh release create "build-${GITHUB_RUN_NUMBER}" dist/* --target "$GITHUB_SHA" --latest \
            --title "PocketEye build ${GITHUB_RUN_NUMBER}" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Not tested on real phones yet.
          - PocketEyeCamera.apk: camera app for old phones (Android 5+), streams to the laptop.
          - PocketEye-arm64.apk: phone-only app for newer phones (Android 7+). Use PocketEye-arm32.apk if arm64 will not install.
          - PocketEye-windows.zip: laptop app, unzip and run PocketEye.exe.
          - pocketeye-cli-windows.zip: command-line tool.
          How to use: docs/USER_GUIDE.md"
